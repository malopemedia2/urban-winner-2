<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Team | TX Theatre</title>
<style>
  :root { --bg:#0b0b0d; --card:#16161a; --line:#2a2a31; --text:#f2f2f2; --muted:#a8a8b0; --accent:#d4a537; --red:#e5484d; --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.55; }
  a { color:var(--accent); text-decoration:none; }

  .hero { text-align:center; padding:56px 20px 36px; background:radial-gradient(ellipse at top,#2a2110 0%,var(--bg) 70%); }
  .hero img { width:90px; margin-bottom:12px; }
  .ribbon { display:inline-block; background:var(--red); color:#fff; padding:6px 18px; border-radius:20px; font-size:.78rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .hero h1 { font-size:2.3rem; line-height:1.2; text-transform:uppercase; letter-spacing:2px; margin:16px 0 10px; }
  .hero h1 span { color:var(--accent); }
  .hero p { color:var(--muted); max-width:560px; margin:0 auto 14px; }

  .pills { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0 20px; margin:6px 0 28px; }
  .pill { background:transparent; border:1px solid #444; color:var(--text); padding:9px 20px; border-radius:30px; cursor:pointer; font:inherit; }
  .pill.on { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }

  .grid { max-width:1000px; margin:0 auto; padding:0 20px 40px; display:grid; gap:24px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .tile { background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--line); display:flex; flex-direction:column; transition:.25s; }
  .tile:hover { transform:translateY(-6px); border-color:var(--accent); }
  .tile .head { padding:22px; background:linear-gradient(135deg,#2a2110,#16161a); display:flex; align-items:center; gap:16px; }
  .tile .emoji { font-size:2.6rem; }
  .tile h3 { font-size:1.15rem; text-transform:uppercase; letter-spacing:1px; }
  .tile .for { color:var(--accent); font-weight:700; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; }
  .tile .body { padding:20px 22px; flex:1; }
  .tile .body p { color:var(--muted); margin-bottom:14px; }
  .tile ul { list-style:none; font-size:.92rem; }
  .tile li { padding:6px 0; border-bottom:1px dashed #2c2c33; display:flex; justify-content:space-between; gap:10px; }
  .tile li span:first-child { color:var(--muted); }
  .tile .foot { padding:0 22px 22px; }
  .btn { display:inline-block; background:var(--accent); color:#000; padding:12px 24px; border-radius:8px; font-weight:700; border:0; cursor:pointer; font:inherit; font-weight:700; width:100%; text-align:center; }
  .btn:hover { filter:brightness(1.1); }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #444; }

  /* slide-in drawer */
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; z-index:30; }
  .shade.open { display:block; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--card); border-left:2px solid var(--accent); z-index:40; transform:translateX(100%); transition:transform .3s; display:flex; flex-direction:column; }
  .drawer.open { transform:none; }
  .drawer .dh { padding:22px 24px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  .drawer .dh h2 { font-size:1.35rem; }
  .drawer .x { background:none; border:0; color:var(--text); font-size:1.6rem; cursor:pointer; }
  .drawer .db { padding:20px 24px; overflow-y:auto; flex:1; }
  .drawer .df { padding:16px 24px; border-top:1px solid var(--line); }
  .db h4 { color:var(--accent); text-transform:uppercase; letter-spacing:1px; font-size:.9rem; margin:20px 0 8px; }
  .db h4:first-child { margin-top:0; }
  .db p, .db li { color:#d0d0d6; }
  .db ul { padding-left:20px; }
  .db li { margin-bottom:6px; }
  .facts { display:grid; grid-template-columns:120px 1fr; gap:8px 12px; font-size:.95rem; }
  .facts dt { color:var(--muted); }

  /* apply modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .overlay.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--accent); border-radius:14px; width:100%; max-width:500px; max-height:92vh; overflow-y:auto; padding:24px; }
  .modal .sub { color:var(--muted); font-size:.9rem; margin:4px 0 16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  .modal input, .modal select, .modal textarea { width:100%; padding:11px; margin-bottom:12px; background:#0f0f12; border:1px solid #333; border-radius:8px; color:var(--text); font:inherit; }
  .modal textarea { min-height:90px; resize:vertical; }
  .modal .actions { display:flex; gap:10px; }
  .note { color:var(--muted); font-size:.8rem; margin-top:10px; }
  footer { text-align:center; padding:26px; color:var(--muted); font-size:.85rem; border-top:1px solid #1f1f24; }
  .home { display:inline-block; margin-top:6px; font-size:.9rem; }
  .formbox { background:var(--card); border:1px solid var(--accent); border-radius:14px; width:100%; max-width:720px; height:92vh; display:flex; flex-direction:column; overflow:hidden; }
  .fbar { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); gap:10px; }
  .fbar .x { background:none; border:0; color:var(--text); font-size:1.7rem; cursor:pointer; vertical-align:middle; }
  .formbox iframe { flex:1; width:100%; border:0; background:#fff; }
</style>
</head>
<body>

<div class="hero">
  <img src="https://res.cloudinary.com/doaj3nv5i/image/upload/v1773021224/cxrf8nxtezkrz0g3cwd0.png" alt="TX Theatre Logo">
  <div><span class="ribbon">Urgently looking</span></div>
  <h1>Join the <span>TX Theatre</span> Stage Team</h1>
  <p>We are looking for Theatre and Dance Facilitators to teach youth and adults. Pick the role that fits you and apply.</p>
  <a class="home" href="/">&larr; Back to Home</a>
</div>

<div class="pills" id="pills">
  <button class="pill on" data-f="">All roles</button>
  <button class="pill" data-f="Theatre">Theatre</button>
  <button class="pill" data-f="Dance">Dance</button>
  <button class="pill" data-f="Youth">Youth</button>
  <button class="pill" data-f="Adults">Adults</button>
</div>

<div class="grid" id="grid"></div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div><h2 id="dTitle"></h2><div id="dSub" style="color:var(--muted)"></div></div><button class="x" id="dClose" aria-label="Close">&times;</button></div>
  <div class="db" id="dBody"></div>
  <div class="df"><button class="btn" id="dApply">Apply for this role</button></div>
</aside>

<div class="overlay" id="overlay">
  <div class="formbox">
    <div class="fbar">
      <div><b id="applyFor"></b><div style="color:var(--muted);font-size:.8rem">Fill in the form below to apply</div></div>
      <div><a id="newTab" href="#" target="_blank" rel="noopener" style="font-size:.85rem;margin-right:14px">Open in new tab</a><button class="x" id="cancel" aria-label="Close">&times;</button></div>
    </div>
    <iframe id="gform" title="Application form" src="about:blank"></iframe>
  </div>
</div>

<footer>© 2026 TX Theatre. All Rights Reserved.</footer>

<script>
/* ===== EDIT HERE ===== */
var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdWGjoNSwD8uTI3wOWJ-b3jwsJXvjoiaY9-EZerDkaE103gJA/viewform";
var ROLE_ENTRY = "";   // optional: the form's "Position" question id, e.g. "entry.123456789" (see instructions)
var APPLY_EMAIL = "info@txtheatre.co.za";   // where applications go
var COMPANY = "TX Theatre";
var LOCATION = "South Africa";              // change to your town/city
var JOBS = [
  {
    id: "theatre-adults", title: "Theatre Facilitator (Adults)", audience: "Adults", type: "Part-time / Contract",
    pay: "Market-related", exp: "3+ years", qual: "A degree in Theatre is advantageous",
    posted: "Posted today", urgent: true,
    summary: "We are looking for a Theatre Facilitator to teach adults.",
    about: "TX Theatre is urgently looking for a Theatre Facilitator who is going to teach adults. You will guide adult learners through acting, scripts, rehearsals and live performance.",
    duties: ["Teach theatre and acting to adult learners", "Run workshops on script work, voice, movement and stagecraft", "Direct short plays and showcase performances", "Give constructive feedback and support to participants", "Work with the production team on shows"],
    reqs: ["Minimum 3 years experience in theatre practice or facilitation", "Experience teaching or directing adults", "Strong communication and leadership skills", "Available evenings and weekends"],
    nice: ["A degree in Theatre or Drama is advantageous", "Professional stage credits"]
  },
  {
    id: "theatre-youth", title: "Theatre Facilitator (Youth)", audience: "Youth", type: "Part-time / Contract",
    pay: "Market-related", exp: "2+ years", qual: "A degree in Theatre is advantageous",
    posted: "Posted today", urgent: true,
    summary: "We are looking for a Theatre Facilitator to teach youth.",
    about: "TX Theatre is urgently looking for a Theatre Facilitator to teach youth. You will help young people build confidence and creativity through theatre games, acting and performance.",
    duties: ["Teach theatre and acting to children and teenagers", "Plan fun, creative classes and workshops", "Prepare learners for showcases and productions", "Create a safe and inclusive learning space", "Track learner progress"],
    reqs: ["Minimum 2 years experience in theatre facilitation", "Experience working with children and teenagers", "Patient, creative and reliable", "Clear criminal record check (will be required)"],
    nice: ["A degree in Theatre, Drama or Education is advantageous", "Experience directing youth productions"]
  },
  {
    id: "dance-adults", title: "Dance Facilitator (Adults)", audience: "Adults", type: "Part-time / Contract",
    pay: "Market-related", exp: "2+ years", qual: "A degree in Dance is advantageous",
    posted: "Posted today", urgent: true,
    summary: "We are looking for a Dance Facilitator to teach adults.",
    about: "TX Theatre is urgently looking for a Dance Facilitator to teach adults, from beginners to experienced dancers, and to create dance pieces for live productions.",
    duties: ["Teach dance classes to adults of all levels", "Choreograph routines for showcases and theatre productions", "Run warm-ups, technique and conditioning sessions", "Rehearse and prepare groups for performances", "Promote safe dance practice"],
    reqs: ["Minimum 2 years experience teaching or performing dance", "Skilled in one or more dance styles", "Choreography experience", "Available evenings and weekends"],
    nice: ["A degree in Dance is advantageous", "First aid certificate"]
  },
  {
    id: "dance-youth", title: "Dance Facilitator (Youth)", audience: "Youth", type: "Part-time / Contract",
    pay: "Market-related", exp: "2+ years", qual: "A degree in Dance is advantageous",
    posted: "Posted today", urgent: true,
    summary: "We are looking for a Dance Facilitator to teach youth.",
    about: "TX Theatre is urgently looking for a Dance Facilitator to teach youth. You will inspire young dancers through fun, safe and energetic classes and performances.",
    duties: ["Teach dance classes to children and teenagers", "Choreograph routines for youth showcases and productions", "Teach technique, rhythm, coordination and teamwork", "Prepare learners for performances", "Create a safe, fun and inclusive space"],
    reqs: ["Minimum 2 years experience teaching or performing dance", "Experience working with children and teenagers", "Skilled in one or more dance styles", "Clear criminal record check (will be required)"],
    nice: ["A degree in Dance is advantageous", "First aid certificate"]
  }
];
/* ===================== */

var $ = function (id) { return document.getElementById(id); };
var current = null, filter = "";
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function li(a) { return a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join(""); }
function find(id) { return JOBS.filter(function (j) { return j.id === id; })[0]; }

function renderGrid() {
  var list = JOBS.filter(function (j) { return !filter || (j.title + " " + j.audience).indexOf(filter) > -1; });
  $("grid").innerHTML = list.map(function (j) {
    var dance = j.title.indexOf("Dance") === 0;
    return '<div class="tile"><div class="head"><div class="emoji">' + (dance ? "💃" : "🎭") + '</div><div><div class="for">' + esc(j.audience) + "</div><h3>" + esc(j.title.replace(/ \(.*\)/, "")) + "</h3></div></div>" +
      '<div class="body"><p>' + esc(j.summary) + "</p><ul>" +
      "<li><span>Experience</span><span>" + esc(j.exp) + "</span></li>" +
      "<li><span>Type</span><span>" + esc(j.type) + "</span></li>" +
      "<li><span>Degree</span><span>Advantageous</span></li></ul></div>" +
      '<div class="foot"><button class="btn" data-id="' + j.id + '">View role &amp; apply</button></div></div>';
  }).join("");
}

function openDrawer(id) {
  current = id; var j = find(id);
  $("dTitle").textContent = j.title;
  $("dSub").textContent = COMPANY + " · " + LOCATION;
  $("dBody").innerHTML =
    "<h4>Role details</h4><dl class=\"facts\"><dt>Pay</dt><dd>" + esc(j.pay) + "</dd><dt>Job type</dt><dd>" + esc(j.type) + "</dd><dt>Experience</dt><dd>" + esc(j.exp) + "</dd><dt>Qualification</dt><dd>" + esc(j.qual) + "</dd><dt>Teaching</dt><dd>" + esc(j.audience) + "</dd><dt>Start date</dt><dd>Immediate (urgent)</dd></dl>" +
    "<h4>About the role</h4><p>" + esc(j.about) + "</p>" +
    "<h4>What you will do</h4><ul>" + li(j.duties) + "</ul>" +
    "<h4>What you need</h4><ul>" + li(j.reqs) + "</ul>" +
    "<h4>Advantageous</h4><ul>" + li(j.nice) + "</ul>" +
    "<h4>How to apply</h4><p>Tap Apply, fill in your details and attach your CV in the email that opens. Shortlisted candidates will be contacted for an interview or audition.</p>";
  $("drawer").classList.add("open"); $("shade").classList.add("open"); $("dBody").scrollTop = 0;
}
function closeDrawer() { $("drawer").classList.remove("open"); $("shade").classList.remove("open"); }

$("grid").addEventListener("click", function (e) { var b = e.target.closest("button[data-id]"); if (b) openDrawer(b.getAttribute("data-id")); });
$("pills").addEventListener("click", function (e) {
  var p = e.target.closest(".pill"); if (!p) return;
  filter = p.getAttribute("data-f");
  Array.prototype.forEach.call(document.querySelectorAll(".pill"), function (x) { x.classList.toggle("on", x === p); });
  renderGrid();
});
$("dClose").onclick = closeDrawer; $("shade").onclick = closeDrawer;
$("dApply").onclick = function () {
  var j = find(current), url = FORM_URL + "?embedded=true";
  if (ROLE_ENTRY) url += "&" + ROLE_ENTRY + "=" + encodeURIComponent(j.title);
  $("applyFor").textContent = "Apply: " + j.title;
  $("gform").src = url;
  $("newTab").href = url.replace("embedded=true", "usp=pp_url");
  $("overlay").classList.add("open");
};
$("cancel").onclick = function () { $("overlay").classList.remove("open"); $("gform").src = "about:blank"; };
$("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) $("overlay").classList.remove("open"); });

renderGrid();
</script>
</body>
</html>
